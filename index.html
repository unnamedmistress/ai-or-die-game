<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>AI OR DIE — by AI Evolution</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  /* ========== NEW PALETTE: Deep midnight purple + electric lime ========== */
  :root {
    --bg:        #1A1530;   /* deep midnight purple */
    --bg-2:      #221B3D;   /* slightly lighter purple */
    --card:      #2B2348;   /* card surface */
    --card-2:    #342A55;   /* inner surface */
    --ink:       #F5F1FF;   /* near-white with violet tint */
    --ink-soft:  #B0A6CC;   /* muted lavender */
    --accent:    #B9F542;   /* electric lime (signature) */
    --accent-2:  #87C232;   /* deeper lime for hover */
    --good:      #5DD68C;   /* mint green */
    --bad:       #FF6B7E;   /* rose red */
    --warn:      #FFC857;   /* amber */
    --border:    #4A3E73;   /* subtle violet border */
    --glow:      0 0 30px rgba(185, 245, 66, 0.25);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { height: 100%; }
  body {
    background: var(--bg);
    background-image:
      radial-gradient(ellipse at top, rgba(185, 245, 66, 0.08), transparent 60%),
      radial-gradient(ellipse at bottom right, rgba(135, 70, 240, 0.15), transparent 50%);
    color: var(--ink);
    font-family: 'Space Grotesk', sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    height: 100dvh;
    overflow: hidden;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }
  body.reduce-motion *, body.reduce-motion *::before, body.reduce-motion *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }

  .serif { font-family: 'Instrument Serif', serif; font-weight: 400; }

  /* ========== APP SHELL ========== */
  .app {
    height: 100dvh;
    max-width: 720px;
    margin: 0 auto;
    display: grid;
    grid-template-rows: auto 1fr auto;
    padding: 14px 18px;
    gap: 12px;
  }

  /* ========== TOP BAR ========== */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .progress-wrap { flex: 1; }
  .progress-label {
    font-size: 10px; font-weight: 700; color: var(--ink-soft);
    text-transform: uppercase; letter-spacing: 0.15em;
  }
  .progress-bar {
    height: 6px; background: var(--bg-2);
    border-radius: 999px;
    overflow: hidden; margin-top: 4px;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    transition: width 350ms ease; width: 0%;
    box-shadow: var(--glow);
  }
  .toggle {
    font-size: 11px;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--ink-soft);
    padding: 6px 10px;
    border-radius: 999px;
    cursor: pointer;
    font-weight: 600;
    font-family: inherit;
    white-space: nowrap;
    transition: all 200ms;
  }
  .toggle:hover { border-color: var(--accent); color: var(--accent); }
  .toggle.active { background: var(--accent); color: var(--bg); border-color: var(--accent); }

  /* ========== STAGE ========== */
  .stage {
    position: relative;
    overflow: hidden;
    border-radius: 22px;
  }

  .card {
    position: absolute;
    inset: 0;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 22px;
    padding: 24px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    opacity: 0;
    pointer-events: none;
    transition: opacity 220ms ease;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.06),
      0 20px 60px rgba(0,0,0,0.4);
  }
  .card.active {
    opacity: 1;
    pointer-events: auto;
  }

  /* ========== BOTTOM BAR ========== */
  .bottombar {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .nav-btn {
    flex: 1;
    background: var(--card);
    color: var(--ink);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 13px 18px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: all 150ms;
    letter-spacing: -0.01em;
  }
  .nav-btn:hover:not(:disabled) {
    border-color: var(--accent);
    color: var(--accent);
  }
  .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .nav-btn.accent {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--bg);
    font-weight: 700;
    box-shadow: var(--glow);
  }
  .nav-btn.accent:hover:not(:disabled) {
    background: var(--accent-2);
    border-color: var(--accent-2);
    color: var(--bg);
    transform: translateY(-1px);
  }
  .nav-btn.ghost {
    background: transparent;
    color: var(--ink-soft);
  }
  .nav-btn.ghost:hover:not(:disabled) {
    border-color: var(--ink-soft);
    color: var(--ink);
  }
  .nav-btn.compact { flex: 0 0 auto; padding: 13px 16px; }

  .step-dots {
    display: flex; gap: 6px;
    align-items: center; justify-content: center;
    flex: 0 0 auto;
  }
  .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--border);
    transition: all 250ms;
  }
  .dot.active {
    background: var(--accent);
    width: 18px;
    border-radius: 3px;
    box-shadow: var(--glow);
  }
  .dot.done { background: var(--ink-soft); }

  /* ========== CARD CONTENT ========== */
  .round-label {
    font-size: 10px; letter-spacing: 0.2em;
    text-transform: uppercase; color: var(--accent);
    font-weight: 700; margin-bottom: 8px;
  }

  h1, h2, h3 {
    font-family: 'Space Grotesk', sans-serif;
    letter-spacing: -0.02em;
  }

  /* ----- TITLE CARD ----- */
  .title-card {
    text-align: center;
    flex: 1;
    justify-content: center;
    align-items: center;
    display: flex;
    flex-direction: column;
  }
  .title-card .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(185, 245, 66, 0.1);
    color: var(--accent);
    font-size: 10px; font-weight: 600; padding: 5px 12px;
    border-radius: 999px; letter-spacing: 0.15em;
    text-transform: uppercase; margin-bottom: 16px;
    border: 1px solid rgba(185, 245, 66, 0.2);
  }
  .title-card .badge::before {
    content: '';
    width: 6px; height: 6px;
    background: var(--accent);
    border-radius: 50%;
    box-shadow: var(--glow);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }
  .title-card h1 {
    font-family: 'Instrument Serif', serif;
    font-weight: 400;
    font-style: italic;
    font-size: clamp(48px, 13vw, 88px);
    line-height: 0.95;
    margin-bottom: 14px;
    letter-spacing: -0.03em;
  }
  .title-card h1 .strike {
    color: var(--accent);
    font-style: normal;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
  }
  .title-card .tag {
    color: var(--ink-soft);
    font-size: 15px;
    margin-bottom: 20px;
    max-width: 420px;
    line-height: 1.5;
  }
  .by-line {
    font-size: 11px;
    color: var(--ink-soft);
    margin-bottom: 20px;
    letter-spacing: 0.05em;
  }
  .by-line strong { color: var(--accent); font-weight: 600; }
  .topics-list {
    text-align: left;
    background: var(--card-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    list-style: none;
    display: grid; gap: 6px;
    font-size: 13px;
    width: 100%;
    max-width: 380px;
  }
  .topics-list li {
    display: grid;
    grid-template-columns: 20px 1fr;
    gap: 8px;
    align-items: center;
  }
  .topics-list .topic-num {
    font-family: 'Instrument Serif', serif;
    font-style: italic;
    font-weight: 400;
    color: var(--accent);
    font-size: 16px;
  }

  /* ----- LESSON HEADER ----- */
  .lesson-header {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
  }
  .lesson-header h2 {
    font-family: 'Instrument Serif', serif;
    font-style: italic;
    font-weight: 400;
    font-size: clamp(32px, 8vw, 48px);
    line-height: 1; margin-bottom: 10px;
  }
  .lesson-header .subtitle {
    color: var(--ink-soft);
    font-size: 13px;
    margin-bottom: 20px;
    letter-spacing: 0.02em;
  }
  .visual {
    width: 100%; max-width: 380px;
    aspect-ratio: 16/9;
    background: var(--card-2);
    border: 1px solid var(--border);
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    padding: 12px;
  }
  .visual svg { width: 100%; height: 100%; }

  /* ----- POINT CARD ----- */
  .point-card {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
  }
  .point-counter {
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 700;
    margin-bottom: 18px;
  }
  .point-num-big {
    font-family: 'Instrument Serif', serif;
    font-style: italic;
    font-weight: 400;
    font-size: clamp(80px, 18vw, 140px);
    color: var(--accent);
    line-height: 0.85;
    margin-bottom: 20px;
    text-shadow: 0 0 40px rgba(185, 245, 66, 0.4);
  }
  .point-text-big {
    font-family: 'Instrument Serif', serif;
    font-weight: 400;
    font-size: clamp(22px, 5vw, 30px);
    line-height: 1.25;
    max-width: 480px;
    color: var(--ink);
  }
  .point-text-big strong {
    color: var(--accent);
    font-style: italic;
    font-weight: 400;
  }

  /* ----- KEY IDEA CARD ----- */
  .key-idea-card {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
  }
  .key-idea-card .icon-big {
    width: 72px; height: 72px;
    background: var(--accent);
    border-radius: 18px;
    display: flex; align-items: center; justify-content: center;
    color: var(--bg);
    font-family: 'Instrument Serif', serif;
    font-style: italic;
    font-weight: 400;
    font-size: 44px;
    margin-bottom: 18px;
    box-shadow: var(--glow);
  }
  .key-idea-card .label {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    color: var(--accent);
    margin-bottom: 12px;
  }
  .key-idea-card .text {
    font-family: 'Instrument Serif', serif;
    font-style: italic;
    font-weight: 400;
    font-size: clamp(30px, 7vw, 44px);
    line-height: 1.15;
    max-width: 480px;
    color: var(--ink);
  }

  /* ----- CONSEQ INTRO ----- */
  .conseq-intro {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
  }
  .conseq-intro h2 {
    font-family: 'Instrument Serif', serif;
    font-style: italic;
    font-weight: 400;
    font-size: clamp(26px, 6vw, 36px);
    line-height: 1.15;
    margin-bottom: 12px;
  }
  .conseq-intro .subtitle {
    color: var(--ink-soft);
    font-size: 14px;
    max-width: 380px;
  }

  /* ----- CASE CARD ----- */
  .case-card {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .case-card .case-tag {
    align-self: flex-start;
    background: var(--card-2);
    color: var(--accent);
    font-size: 10px; font-weight: 700;
    padding: 5px 12px; border-radius: 999px;
    letter-spacing: 0.15em; text-transform: uppercase;
    margin-bottom: 14px;
    border: 1px solid var(--border);
  }
  .case-card .case-title {
    font-family: 'Instrument Serif', serif;
    font-weight: 400;
    font-style: italic;
    font-size: clamp(20px, 5vw, 26px);
    line-height: 1.2;
    margin-bottom: 18px;
    color: var(--ink);
  }
  .flow-stack {
    display: flex; flex-direction: column;
    gap: 10px;
  }
  .flow-box {
    padding: 14px 16px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.5;
  }
  .flow-cause {
    background: var(--card-2);
    border: 1px solid var(--border);
  }
  .flow-effect {
    background: rgba(255, 107, 126, 0.08);
    border: 1px solid rgba(255, 107, 126, 0.3);
  }
  .flow-arrow-down {
    align-self: center;
    color: var(--accent);
    font-size: 20px;
    line-height: 1;
    opacity: 0.8;
  }
  .flow-label {
    font-size: 9px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.2em;
    margin-bottom: 6px;
    color: var(--ink-soft);
  }
  .flow-label.danger { color: var(--bad); }

  /* ----- PUNCHLINE ----- */
  .punchline-card {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
  }
  .punchline-card .icon-big {
    width: 72px; height: 72px;
    background: var(--bad);
    border-radius: 18px;
    display: flex; align-items: center; justify-content: center;
    color: var(--ink);
    font-family: 'Instrument Serif', serif;
    font-style: italic;
    font-weight: 400;
    font-size: 44px;
    margin-bottom: 18px;
    box-shadow: 0 0 30px rgba(255, 107, 126, 0.3);
  }
  .punchline-card .label {
    font-size: 10px; font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    color: var(--bad);
    margin-bottom: 12px;
  }
  .punchline-card .text {
    font-family: 'Instrument Serif', serif;
    font-style: italic;
    font-weight: 400;
    font-size: clamp(26px, 6vw, 38px);
    line-height: 1.15;
    max-width: 480px;
    color: var(--ink);
  }

  /* ----- GAME ----- */
  .game-card {
    flex: 1;
    display: flex;
    flex-direction: column;
  }
  .game-card h2 {
    font-family: 'Instrument Serif', serif;
    font-style: italic;
    font-weight: 400;
    font-size: clamp(24px, 6vw, 32px);
    line-height: 1.1;
    margin-bottom: 4px;
  }
  .game-card .subtitle {
    color: var(--ink-soft);
    font-size: 13px;
    margin-bottom: 14px;
  }
  .stats {
    display: flex; justify-content: space-between;
    margin-bottom: 14px; padding: 10px 14px;
    background: var(--card-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    font-weight: 500; font-size: 12px;
    color: var(--ink-soft);
  }
  .stat-num {
    font-family: 'Instrument Serif', serif;
    font-style: italic;
    font-size: 18px; font-weight: 400;
    color: var(--accent);
    margin-left: 6px;
  }
  .question-card {
    background: var(--card-2);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 14px;
    flex: 1;
    display: flex;
    align-items: center;
    font-size: 16px; line-height: 1.5;
    font-family: 'Instrument Serif', serif;
    font-weight: 400;
    color: var(--ink);
  }
  .quote-marks {
    font-family: 'Instrument Serif', serif;
    font-style: italic;
    font-size: 48px;
    line-height: 0;
    color: var(--accent);
    font-weight: 400;
    vertical-align: -8px;
    margin-right: 6px;
    opacity: 0.7;
  }
  .answers { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .answer-btn {
    border: 1px solid var(--border);
    background: var(--card-2);
    color: var(--ink);
    padding: 16px 10px; border-radius: 12px;
    cursor: pointer; font-family: inherit;
    font-weight: 600; font-size: 13px;
    transition: all 150ms;
    text-align: center;
    letter-spacing: 0.02em;
  }
  .answer-btn:hover:not(:disabled) {
    border-color: var(--accent);
    color: var(--accent);
    transform: translateY(-1px);
  }
  .answer-btn .icon {
    font-size: 22px;
    display: block;
    margin-bottom: 4px;
    font-family: 'Instrument Serif', serif;
    font-style: italic;
    color: var(--accent);
  }
  .answer-btn:disabled { cursor: not-allowed; opacity: 0.7; }
  .answer-btn.correct {
    background: var(--good);
    color: var(--bg);
    border-color: var(--good);
  }
  .answer-btn.correct .icon { color: var(--bg); }
  .answer-btn.wrong {
    background: var(--bad);
    color: var(--ink);
    border-color: var(--bad);
  }
  .answer-btn.wrong .icon { color: var(--ink); }

  .feedback {
    margin-top: 12px; padding: 14px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--card-2);
    display: none;
    font-size: 13px;
  }
  .feedback.show { display: block; }
  .feedback.right {
    background: rgba(93, 214, 140, 0.08);
    border-color: rgba(93, 214, 140, 0.3);
  }
  .feedback.wrong {
    background: rgba(255, 107, 126, 0.08);
    border-color: rgba(255, 107, 126, 0.3);
  }
  .feedback h3 {
    font-family: 'Instrument Serif', serif;
    font-style: italic;
    font-weight: 400;
    font-size: 18px;
    margin-bottom: 6px;
  }
  .feedback.right h3 { color: var(--good); }
  .feedback.wrong h3 { color: var(--bad); }
  .feedback p { line-height: 1.5; color: var(--ink-soft); }

  /* ----- ROUND DONE / FINAL ----- */
  .round-done-card, .final-card {
    flex: 1;
    display: flex;
    flex-direction: column;
    text-align: center;
    align-items: center;
    justify-content: center;
  }
  .round-done-card h2 {
    font-family: 'Instrument Serif', serif;
    font-style: italic;
    font-weight: 400;
    font-size: clamp(28px, 7vw, 40px);
    line-height: 1; margin-bottom: 8px;
  }
  .score-big {
    font-family: 'Instrument Serif', serif;
    font-style: italic;
    font-weight: 400;
    font-size: clamp(64px, 16vw, 96px);
    color: var(--accent);
    line-height: 1;
    margin: 12px 0 14px;
    text-shadow: 0 0 40px rgba(185, 245, 66, 0.4);
  }
  .round-done-card p {
    color: var(--ink-soft);
    font-size: 14px;
    max-width: 380px;
  }

  .final-card h2 {
    font-family: 'Instrument Serif', serif;
    font-style: italic;
    font-weight: 400;
    font-size: clamp(36px, 9vw, 52px);
    line-height: 1; margin-bottom: 8px;
  }
  .total-score {
    font-family: 'Instrument Serif', serif;
    font-style: italic;
    font-weight: 400;
    font-size: clamp(72px, 18vw, 110px);
    color: var(--accent);
    line-height: 1;
    margin-bottom: 14px;
    text-shadow: 0 0 40px rgba(185, 245, 66, 0.4);
  }
  .verdict {
    background: var(--card-2);
    border: 1px solid var(--border);
    color: var(--ink);
    border-radius: 12px;
    padding: 12px 18px;
    font-family: 'Instrument Serif', serif;
    font-style: italic;
    font-weight: 400;
    font-size: 16px;
    margin-bottom: 16px;
    max-width: 380px;
  }
  .breakdown {
    display: grid; gap: 5px;
    width: 100%; max-width: 380px;
    font-size: 12px;
    margin-bottom: 14px;
    text-align: left;
  }
  .breakdown-row {
    display: grid; grid-template-columns: 24px 1fr auto;
    align-items: center; gap: 10px;
    padding: 8px 12px;
    background: var(--card-2);
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  .breakdown-row .num {
    font-family: 'Instrument Serif', serif;
    font-style: italic;
    font-weight: 400;
    color: var(--accent);
    font-size: 16px;
  }
  .breakdown-row .pts {
    font-family: 'Instrument Serif', serif;
    font-style: italic;
    font-weight: 400;
    color: var(--accent);
    font-size: 15px;
  }
  .cta-pill {
    background: var(--accent);
    color: var(--bg);
    border: none;
    border-radius: 999px;
    padding: 12px 22px;
    font-family: inherit;
    font-weight: 700;
    font-size: 13px;
    text-decoration: none;
    margin-top: 10px;
    display: inline-block;
    transition: all 150ms;
    box-shadow: var(--glow);
    letter-spacing: 0.02em;
  }
  .cta-pill:hover {
    transform: translateY(-2px);
    background: var(--accent-2);
  }
</style>
</head>
<body>
<div class="app">

  <!-- TOP BAR -->
  <div class="topbar">

let deck = [];
let cardIdx = 0;
let totalScore = 0;
const roundScores = [];
let currentRoundScore = 0;
let currentRoundQ = 0;

function buildDeck() {
  deck = [];
  deck.push({ type: 'title', round: -1 });
  ROUNDS.forEach((r, ri) => {
    deck.push({ type: 'lessonHeader', round: ri });
    r.points.forEach((_, pi) => deck.push({ type: 'point', round: ri, pointIdx: pi }));
    deck.push({ type: 'keyIdea', round: ri });
    deck.push({ type: 'conseqIntro', round: ri });
    r.cases.forEach((_, ci) => deck.push({ type: 'case', round: ri, caseIdx: ci }));
    deck.push({ type: 'punchline', round: ri });
    deck.push({ type: 'game', round: ri });
    deck.push({ type: 'roundDone', round: ri });
  });
  deck.push({ type: 'final', round: -1 });
}

const stage = document.getElementById('stage');
const btnPrev = document.getElementById('btn-prev');
const btnNext = document.getElementById('btn-next');
const stepDots = document.getElementById('step-dots');
const progressFill = document.getElementById('progress-fill');
const roundNumLabel = document.getElementById('round-num');

function show(html) {
  stage.innerHTML = `<div class="card active">${html}</div>`;
}

function render() {
  const card = deck[cardIdx];
  show(renderCard(card));
  updateNav();
  updateProgress();
  wireGameIfNeeded(card);
}

function renderCard(card) {
  const r = card.round >= 0 ? ROUNDS[card.round] : null;
  switch (card.type) {
    case 'title': return renderTitle();
    case 'lessonHeader':
      return `<div class="lesson-header">
        <div class="round-label">Round ${card.round + 1} · Lesson</div>
        <h2>${r.title}</h2>
        <p class="subtitle">${r.subtitle}</p>
        <div class="visual">${VISUALS[r.visual]}</div>
      </div>`;
    case 'point':
      return `<div class="point-card">
        <div class="point-counter">Point ${card.pointIdx + 1} of 3</div>
        <div class="point-num-big">${card.pointIdx + 1}</div>
        <div class="point-text-big">${r.points[card.pointIdx]}</div>
      </div>`;
    case 'keyIdea':
      return `<div class="key-idea-card">
        <div class="icon-big">!</div>
        <div class="label">Remember this</div>
        <div class="text">${r.keyIdea}</div>
      </div>`;
    case 'conseqIntro':
      return `<div class="conseq-intro">
        <div class="round-label">Round ${card.round + 1} · Real World</div>
        <h2>What happens if you don't know this?</h2>
        <p class="subtitle">3 real stories. All in the news.</p>
      </div>`;
    case 'case': {
      const c = r.cases[card.caseIdx];
      return `<div class="case-card">
        <div class="round-label" style="margin-bottom:8px;">Story ${card.caseIdx + 1} of 3</div>
        <span class="case-tag">${c.tag}</span>
        <div class="case-title">${c.title}</div>
        <div class="flow-stack">
          <div class="flow-box flow-cause">
            <div class="flow-label">What they did</div>
            ${c.cause}
          </div>
          <div class="flow-arrow-down">↓</div>
          <div class="flow-box flow-effect">
            <div class="flow-label danger">What happened</div>
            ${c.effect}
          </div>
        </div>
      </div>`;
    }
    case 'punchline':
      return `<div class="punchline-card">
        <div class="icon-big">!</div>
        <div class="label">The pattern</div>
        <div class="text">${r.punchline}</div>
      </div>`;
    case 'game':
      return `<div class="game-card">
        <div class="round-label">Round ${card.round + 1} · Game</div>
        <h2>${r.gameTitle}</h2>
        <p class="subtitle">${r.gameSub}</p>
        <div class="stats">
          <span>Score <span class="stat-num" id="score">${currentRoundScore}</span></span>
          <span>Question <span class="stat-num"><span id="q-num">${currentRoundQ + 1}</span> / ${r.questions.length}</span></span>
        </div>
        <div class="question-card">
          <div><span class="quote-marks">"</span><span id="q-text">${r.questions[currentRoundQ].text}</span></div>
        </div>
        <div class="answers">
          ${r.options.map(o => `<button class="answer-btn" data-answer="${o.value}"><span class="icon">${o.icon}</span>${o.label}</button>`).join('')}
        </div>
        <div class="feedback" id="feedback">
          <h3 id="fb-title"></h3>
          <p id="fb-text"></p>
        </div>
      </div>`;
    case 'roundDone': {
      const score = roundScores[card.round] !== undefined ? roundScores[card.round] : currentRoundScore;
      const total = r.questions.length;
      let msg;
      if (score === total) msg = 'Perfect round. You spotted everything.';
      else if (score >= 3) msg = 'Solid. You\'re catching the patterns.';
      else msg = 'Tough round. These traps are designed to slip past you.';
      return `<div class="round-done-card">
        <div class="round-label">Round ${card.round + 1} Complete</div>
        <h2>${r.title}</h2>
        <div class="score-big">${score}/${total}</div>
        <p>${msg}</p>
      </div>`;
    }
    case 'final': return renderFinal();
  }
}

function renderTitle() {
  return `<div class="title-card">
    <span class="badge">8 Rounds · By AI Evolution</span>
    <h1>AI <span class="strike">OR</span> DIE</h1>
    <p class="tag">Learn how to use AI without getting fooled, sued, or hacked.</p>
    <div class="by-line">Built by <strong>AI Evolution</strong> · myaievolution.com</div>
    <ul class="topics-list">
      ${ROUNDS.map((r, i) => `<li><span class="topic-num">${i + 1}.</span><span>${r.title}</span></li>`).join('')}
    </ul>
    <a class="cta-pill" href="https://www.myaievolution.com/workbook-v3">← Back to the workbook</a>
  </div>`;
}

function renderFinal() {
  const max = ROUNDS.reduce((s, r) => s + r.questions.length, 0);
  let verdict;
  const pct = totalScore / max;
  if (pct === 1) verdict = '🏆 Perfect — AI literacy champion';
  else if (pct >= 0.8) verdict = '⭐ Expert — You spot the traps';
  else if (pct >= 0.6) verdict = '👍 Solid — Good instincts';
  else if (pct >= 0.4) verdict = '📚 Learning — On the right track';
  else verdict = '🎯 Start here — Try again';

  return `<div class="final-card">
    <div class="round-label">Show Complete</div>
    <h2>That's a wrap.</h2>
    <div class="total-score">${totalScore}/${max}</div>
    <div class="verdict">${verdict}</div>
    <div class="breakdown">
      ${ROUNDS.map((r, i) => `
        <div class="breakdown-row">
          <span class="num">${i + 1}.</span>
          <span>${r.title}</span>
          <span class="pts">${roundScores[i]}/${r.questions.length}</span>
        </div>
      `).join('')}
    </div>
    <a class="cta-pill" href="https://myaievolution.com" target="_blank" rel="noopener">Get trained → myaievolution.com</a>
    <a class="cta-pill" href="https://www.myaievolution.com/workbook-v3" target="_blank" rel="noopener">Back to the workbook</a>
  </div>`;
}

function wireGameIfNeeded(card) {
  if (card.type !== 'game') return;
  const r = ROUNDS[card.round];
  document.querySelectorAll('.answer-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const picked = btn.dataset.answer;
      const q = r.questions[currentRoundQ];
      const right = picked === q.answer;
      if (right) currentRoundScore++;
      document.querySelectorAll('.answer-btn').forEach(b => b.disabled = true);
      btn.classList.add(right ? 'correct' : 'wrong');
      if (!right) {
        document.querySelector(`.answer-btn[data-answer="${q.answer}"]`).classList.add('correct');
      }
      const fb = document.getElementById('feedback');
      fb.classList.add('show', right ? 'right' : 'wrong');
      document.getElementById('fb-title').textContent = right ? 'Got it.' : 'Not quite.';
      document.getElementById('fb-text').textContent = right ? q.right : q.wrong;
      document.getElementById('score').textContent = currentRoundScore;
      btnNext.textContent = currentRoundQ < r.questions.length - 1 ? 'Next question →' : 'See results →';
      btnNext.disabled = false;
    });
  });
  btnNext.disabled = true;
}

function updateNav() {
  const card = deck[cardIdx];
  btnPrev.disabled = cardIdx === 0;
  btnNext.disabled = false;
  if (card.type === 'title') btnNext.textContent = 'Start the show ▶';
  else if (card.type === 'final') btnNext.textContent = 'Play again ↻';
  else if (card.type === 'game') btnNext.textContent = 'Answer to continue';
  else if (card.type === 'roundDone') {
    const isLast = card.round === ROUNDS.length - 1;
    if (isLast) {
      btnNext.textContent = 'See final score →';
    } else {
      const nextTitle = ROUNDS[card.round + 1].title;
      btnNext.textContent = `Round ${card.round + 2} →`;
    }
  } else btnNext.textContent = 'Next →';
  renderStepDots(card);
}

function renderStepDots(card) {
  if (card.round < 0) { stepDots.innerHTML = ''; return; }
  const roundCards = deck.map((c, i) => c.round === card.round ? i : -1).filter(i => i >= 0);
  const posInRound = roundCards.indexOf(cardIdx);
  stepDots.innerHTML = roundCards.map((_, i) => {
    let cls = 'dot';
    if (i < posInRound) cls += ' done';
    else if (i === posInRound) cls += ' active';
    return `<span class="${cls}"></span>`;
  }).join('');
}

function updateProgress() {
  const card = deck[cardIdx];
  if (card.round < 0) {
    if (card.type === 'final') {
      progressFill.style.width = '100%';
      roundNumLabel.textContent = '8';
    } else {
      progressFill.style.width = '0%';
      roundNumLabel.textContent = '1';
    }
    return;
  }
  const overallPct = (cardIdx / (deck.length - 1)) * 100;
  progressFill.style.width = overallPct + '%';
  roundNumLabel.textContent = card.round + 1;
}

btnNext.addEventListener('click', () => {
  const card = deck[cardIdx];
  if (card.type === 'final') {
    cardIdx = 0; totalScore = 0; roundScores.length = 0;
    currentRoundScore = 0; currentRoundQ = 0;
    render(); return;
  }
  if (card.type === 'game') {
    const r = ROUNDS[card.round];
    if (currentRoundQ < r.questions.length - 1) {
      currentRoundQ++; render(); return;
    } else {
      roundScores[card.round] = currentRoundScore;
      totalScore += currentRoundScore;
      currentRoundQ = 0; currentRoundScore = 0;
      cardIdx++; render(); return;
    }
  }
  cardIdx++;
  if (deck[cardIdx] && deck[cardIdx].type === 'game') {
    currentRoundScore = 0; currentRoundQ = 0;
  }
  render();
});

btnPrev.addEventListener('click', () => {
  if (cardIdx === 0) return;
  const card = deck[cardIdx];
  if (card.type === 'game' && currentRoundQ > 0) {
    currentRoundQ--; render(); return;
  }
  cardIdx--; render();
});

const motionBtn = document.getElementById('motion-toggle');
motionBtn.addEventListener('click', () => {
  const on = document.body.classList.toggle('reduce-motion');
  motionBtn.classList.toggle('active', on);
  motionBtn.setAttribute('aria-pressed', on);
});

buildDeck();
render();
</script>
</body>
